name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run check-types build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5

      - run: docker build -t memories .

  test:
    name: Tests
    runs-on: ubuntu-latest
    # A throwaway Postgres just for the tests (emptied before every test)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: memories
          POSTGRES_PASSWORD: memories
          POSTGRES_DB: memories
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memories"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://memories:memories@localhost:5432/memories_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit tests, then integration tests against the test database
      - run: pnpm turbo run test
